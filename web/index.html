<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Image · 生图工作台</title>
    <link rel="icon" href="./icon.png" type="image/png" />
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="rail">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <img src="./icon.png" alt="" width="32" height="32" />
          </span>
          <div>
            <strong>AI Image</strong>
            <small>生图工作台</small>
          </div>
        </div>
        <nav id="nav" class="nav" aria-label="页面"></nav>
        <div class="rail-foot">
          <button id="theme-toggle" class="btn ghost icon-btn" type="button" title="换成深色"></button>
          <span id="version" class="version"></span>
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <div class="title-block">
            <h1 id="view-title">概览</h1>
            <p id="view-sub"></p>
          </div>
          <div class="topbar-actions">
            <span id="dirty" class="dirty hidden">有未保存的修改</span>
            <button id="btn-discard" class="btn ghost hidden" type="button">放弃</button>
            <button id="btn-save" class="btn primary hidden" type="button">
              <svg viewBox="0 0 24 24" class="icon">
                <path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"></path>
                <path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"></path>
                <path d="M7 3v4a1 1 0 0 0 1 1h7"></path>
              </svg>
              保存配置
            </button>
            <button id="btn-refresh" class="btn ghost icon-btn" type="button" title="刷新">
              <svg viewBox="0 0 24 24" class="icon">
                <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
                <path d="M21 3v5h-5"></path>
                <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
                <path d="M8 16H3v5"></path>
              </svg>
            </button>
          </div>
        </header>
        <div id="notes" class="notes hidden"></div>
        <section id="view" class="view" aria-live="polite"></section>
      </main>
    </div>
    <div id="toast" class="toast" role="status"></div>
    <div id="modal" class="modal hidden"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
